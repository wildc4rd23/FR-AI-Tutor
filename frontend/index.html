<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assistant Vocal Français</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6fb;
      color: #333;
      padding: 10px;
    }

    .container {
      max-width: 950px;
      max-height: 925px;
      margin: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #667eea;
      color: white;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .header h1 { font-size: 1.4em; font-weight: 500; }

    .chat-toggle {
      position: absolute;
      top: 12px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
    }

    /* Chat History */
    .chat-history {
      background: #f9fafc;
      border-bottom: 1px solid #e2e8f0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .chat-history.show { max-height: 140px; padding: 10px 20px; }

    .chat-message {
      margin-bottom: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85em;
    }
    .chat-message.user { background: #e6fffa; border-left: 3px solid #38b2ac; }
    .chat-message.assistant { background: #fef5e7; border-left: 3px solid #ed8936; }

    /* Main */
    .main-content { flex: 1; overflow-y: auto; padding: 20px; }

    #startSection { text-align: center; padding: 30px 20px; }
    #startSection h3 { margin-bottom: 15px; color: #4a5568; }

    select, button {
      padding: 8px 14px;
      font-size: 0.9em;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      cursor: pointer;
      background: white;
    }

    .btn-primary { background: #667eea; color: white; border: none; }
    .btn-primary:hover { background: #5a67d8; }

    /* Conversation */
    #conversationSection { display: flex; flex-direction: column; gap: 15px; }

    .text-block {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .text-block.assistant-response { border-left: 4px solid #ed8936; }
    .text-block.user-input { border-left: 4px solid #38b2ac; }

    .block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #4a5568;
      font-size: 0.95em;
    }

    .text-content {
      background: white;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      min-height: 70px;
      font-size: 0.9em;
      overflow-y: auto;
    }

    .editable-text { background: #f0fff4; border: 2px solid #38a169; }

    /* Controls */
    .controls-inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn-record { background: #e53e3e; color: white; border: none; }
    .btn-stop { background: #2d3748; color: white; border: none; }
    .btn-send { background: #38a169; color: white; border: none; }

    /* Audio Controls (separate sliders) */
    .audio-wrapper { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 300px; }
    .slider { width: 100%; }

    /* Footer */
    .footer-controls { text-align: center; padding: 12px 0; border-top: 1px solid #e2e8f0; }

    /* Responsive */
    @media (max-width: 768px) {
      .block-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Assistant Vocal Français B1/B2</h1>
      <button class="chat-toggle" id="chatToggle">📜 Historique</button>
    </div>

    <div class="chat-history" id="chatHistory">
      <div id="chatMessages"></div>
    </div>

    <div class="main-content">
      <!-- Start -->
      <div id="startSection">
        <h3>Choisissez un thème :</h3>
        <select id="scenario">
          <option value="">-- Sélectionnez --</option>
          <option value="restaurant">🍽️ Restaurant</option>
          <option value="loisirs">🎯 Loisirs</option>
          <option value="travail">💼 Travail</option>
          <option value="courses">🛒 Courses</option>
          <option value="medecin">🏥 Médecin</option>
          <option value="voyage">✈️ Voyage</option>
          <option value="libre">💬 Sujet libre</option>
        </select>
        <div style="margin-top: 15px;">
          <button id="startConversation" class="btn-primary">🚀 Démarrer</button>
        </div>
      </div>

      <!-- Conversation -->
      <div id="conversationSection" class="hidden">
        <div class="text-block assistant-response">
          <div class="block-header">👨‍🏫 Réponse</div>
          <div class="text-content" id="responseText">...</div>
          <div class="audio-wrapper hidden" id="assistantAudioControls">
            <label>▶️ Lecture
              <input type="range" id="playbackSlider" class="slider">
            </label>
            <label>🔊 Volume
              <input type="range" id="volumeSlider" class="slider">
            </label>
          </div>
        </div>

        <div class="text-block user-input">
          <div class="block-header">🎙️ Votre réponse</div>
          <div class="controls-inline">
            <button id="record" class="btn-record">Enregistrer</button>
            <button id="stop" class="btn-stop hidden">Stop</button>
            <button id="sendMessage" class="btn-send">Envoyer</button>
          </div>
          <div class="text-content editable-text" id="userText" contenteditable="true">
            Tapez votre message ici...
          </div>
        </div>

        <div class="footer-controls">
          <button id="newConversation">🔄 Nouveau sujet</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
