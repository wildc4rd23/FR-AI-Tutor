<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assistant Vocal Français</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      min-height: 100vh;
      color: #e5e7eb;
      padding: 20px;
    }
    
    .container {
      max-width: 950px;
      max-height: 925px;
      margin: 0 auto;
      background: #1a1a1a;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Header - Minimiert */
    .header {
      background: #2d2d2d;
      color: white;
      padding: 20px 24px;
      position: relative;
    }
    
    .header h1 {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .theme-display {
      font-size: 0.9em;
      opacity: 0.9;
      font-weight: 400;
    }
    
    /* Chat History Toggle */
    .chat-toggle {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    
    .chat-toggle:hover {
      background: rgba(255,255,255,0.25);
    }
    
    /* Chat History */
    .chat-history {
      background: #262626;
      max-height: 0;
      overflow-y: auto;
      transition: max-height 0.3s ease;
    }
    
    .chat-history.show {
      max-height: 160px;
      padding: 16px 24px;
    }
    
    .chat-message {
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85em;
      line-height: 1.4;
    }
    
    .chat-message.user {
      background: #1e3a8a;
      color: #bfdbfe;
    }
    
    .chat-message.assistant {
      background: #374151;
      color: #d1d5db;
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    
    /* Start Section */
    #startSection {
      text-align: center;
      padding: 60px 20px;
    }
    
    #startSection h3 {
      margin-bottom: 24px;
      color: #d1d5db;
      font-weight: 500;
    }
    
    select {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 2px solid #4b5563;
      border-radius: 12px;
      font-size: 1em;
      background: #374151;
      color: #f9fafb;
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }
    
    select:focus {
      outline: none;
      border-color: #6b7280;
    }
    
    /* Conversation Layout */
    #conversationSection {
      display: grid;
      grid-template-rows: 1fr 1fr auto;
      gap: 20px;
      height: 100%;
      max-height: calc(925px - 180px);
    }
    
    /* Message Blocks */
    .message-block {
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    
    .assistant-block {
      background: #404040;
      position: relative;
    }
    
    .user-block {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      position: relative;
    }
    
    .message-icon {
      display: none;
    }
    
    .message-content {
      margin-left: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .text-content {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.95em;
      line-height: 1.5;
      min-height: 80px;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 12px;
      color: #f9fafb;
    }
    
    .editable-text {
      background: rgba(255,255,255,0.08) !important;
      outline: none;
      cursor: text;
    }
    
    .editable-text:focus {
      background: rgba(255,255,255,0.12) !important;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
    }
    
    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-start;
    }
    
    /* Buttons - Grau mit farbigen Icons */
    .btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
      background: #4b5563;
      color: #9ca3af;
    }
    
    .btn:hover:not(:disabled) {
      background: #6b7280;
    }
    
    .btn-primary {
      background: #4b5563;
      padding: 12px 24px;
      width: auto;
      height: auto;
      font-size: 0.95em;
      font-weight: 500;
      color: #f9fafb;
    }
    
    .btn-primary:hover {
      background: #6b7280;
      transform: translateY(-1px);
    }
    
    .btn-record {
      color: #ef4444;
    }
    
    .btn-record.recording {
      color: #f97316;
      animation: pulse 1.5s infinite;
    }
    
    .btn-stop {
      color: #9ca3af;
    }
    
    .btn-play {
      color: #10b981;
    }
    
    .btn-send {
      color: #3b82f6;
    }
    
    .btn-secondary {
      background: #4b5563;
      color: #d1d5db;
      padding: 10px 20px;
      width: auto;
      height: auto;
      font-size: 0.9em;
    }
    
    .btn-secondary:hover {
      background: #6b7280;
    }
    
    .btn:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Audio Player - Überarbeitet */
    .audio-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 300px;
    }
    
    .custom-audio {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 6px 12px;
      flex: 1;
    }
    
    .progress-container {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    
    .progress-bar {
      height: 100%;
      background: #10b981;
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s ease;
    }
    
    .time-display {
      font-size: 0.75em;
      color: #d1d5db;
      min-width: 40px;
      text-align: center;
    }
    
    /* Footer */
    .footer-controls {
      text-align: center;
      padding: 16px 0;
      border-top: 1px solid #4b5563;
    }
    
    /* Status Messages */
    .status-message {
      padding: 8px 12px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 0.85em;
      text-align: center;
    }
    
    .status-loading { background: #1e3a8a; color: #bfdbfe; }
    .status-error { background: #7f1d1d; color: #fca5a5; }
    .status-success { background: #14532d; color: #86efac; }
    .status-warning { background: #78350f; color: #fcd34d; }
    
    /* Utilities */
    .hidden { display: none !important; }
    .placeholder { color: #6b7280; font-style: italic; }
    
    .keyboard-hint {
      font-size: 0.7em;
      color: #9ca3af;
      text-align: center;
      margin-top: 8px;
      opacity: 0.8;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      body { padding: 10px; }
      
      .container {
        max-height: 100vh;
        border-radius: 12px;
      }
      
      .header { 
        padding: 16px 20px; 
      }
      
      .header h1 { 
        font-size: 1.2em; 
      }
      
      .main-content { 
        padding: 20px; 
      }
      
      #conversationSection {
        grid-template-rows: auto auto auto;
        gap: 16px;
        max-height: calc(100vh - 140px);
      }
      
      .message-block {
        padding: 16px;
      }
      
      .message-icon {
        position: static;
        margin-bottom: 8px;
        align-self: flex-start;
      }
      
      .message-content {
        margin-left: 0;
      }
      
      .text-content {
        max-height: 120px;
        font-size: 1em;
      }
      
      .controls {
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .audio-container {
        max-width: 100%;
        order: 1;
        width: 100%;
      }
      
      .chat-toggle {
        position: static;
        margin-top: 12px;
        align-self: center;
      }
      
      #startSection {
        padding: 40px 16px;
      }
    }
    
    @media (max-width: 480px) {
      .controls {
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }
      
      .btn {
        width: 100%;
        height: 44px;
      }
      
      .audio-container {
        width: 100%;
        max-width: none;
      }
      
      .text-content {
        max-height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Assistant Vocal Français B1/B2</h1>
      <button class="chat-toggle" id="chatToggle">📜</button>
      <div class="theme-display">
        <span id="currentScenarioDisplay">Thème: Non sélectionné</span>
      </div>
    </div>

    <!-- Chat History -->
    <div class="chat-history" id="chatHistory">
      <div id="chatMessages">
        <!-- Chat messages will be inserted here -->
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Start Section -->
      <div id="startSection">
        <h3>Choisissez un thème de conversation :</h3>
        <select id="scenario">
          <option value="">-- Sélectionnez un thème --</option>
          <option value="restaurant">🍽️ Restaurant - Commander un repas</option>
          <option value="loisirs">🎯 Loisirs - Parler de vos hobbies</option>
          <option value="travail">💼 Travail - Environnement professionnel</option>
          <option value="faire_les_courses">🛒 Faire les courses - Au supermarché</option>
          <option value="visite_chez_le_médecin">🏥 Visite chez le médecin</option>
          <option value="voyage">✈️ Voyage - Planifier des vacances</option>
          <option value="libre">💬 Sujet libre (conversation ouverte)</option>
        </select>
        <button id="startConversation" class="btn btn-primary">🚀 Démarrer la conversation</button>
      </div>

      <!-- Conversation Section -->
      <div id="conversationSection" class="hidden">
        <!-- Assistant Response -->
        <div class="message-block assistant-block">
          <div class="message-icon">🤖</div>
          <div class="message-content">
            <div class="text-content" id="responseText">...</div>
            
            <div class="controls">
              <div class="audio-container hidden" id="assistantAudioContainer">
                <div class="custom-audio">
                  <div class="progress-container" id="assistantProgress">
                    <div class="progress-bar" id="assistantProgressBar"></div>
                  </div>
                  <div class="time-display" id="assistantTime">0:00</div>
                </div>
              </div>
              <button id="playAssistantAudio" class="btn btn-play hidden">▶️</button>
              <button id="showResponseBtn" class="btn btn-secondary hidden">👁️</button>
              
              <!-- Assistant Audio Player -->
              <audio id="audioPlayback" controls class="hidden">
                Votre navigateur ne supporte pas l'élément audio.
              </audio>
            </div>
          </div>
        </div>

        <!-- User Input Section -->
        <div class="message-block user-block">
          <div class="message-icon">👤</div>
          <div class="message-content">
            <div class="text-content editable-text" 
                 id="userText" 
                 contenteditable="true"
                 data-placeholder="Tapez votre message ici ou utilisez l'enregistrement...">
              Tapez votre message ici ou utilisez l'enregistrement...
            </div>
            
            <div class="controls">
              <button id="record" class="btn btn-record">🎙️</button>
              <button id="stop" class="btn btn-stop hidden">⏹️</button>
              
              <div class="audio-container hidden" id="userAudioContainer">
                <div class="custom-audio">
                  <div class="progress-container" id="userProgress">
                    <div class="progress-bar" id="userProgressBar"></div>
                  </div>
                  <div class="time-display" id="userTime">0:00</div>
                </div>
              </div>
              
              <button id="playUserAudio" class="btn btn-play hidden">▶️</button>
              <button id="sendMessage" class="btn btn-send">📤</button>
            </div>
            
            <div class="keyboard-hint">
              Raccourcis: Espace = Pause/Reprendre | Ctrl+Entrée = Envoyer
            </div>
            
            <div id="recordingStatus" class="hidden"></div>
            
            <!-- User Audio Player -->
            <audio id="userAudio" controls class="hidden">
              Votre navigateur ne supporte pas l'élément audio.
            </audio>
          </div>
        </div>

        <!-- Footer Controls -->
        <div class="footer-controls">
          <button id="newConversation" class="btn btn-secondary">🔄 Nouveau sujet</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden audio elements for script compatibility -->
  <div class="hidden">
    <audio id="audioPlaybackHidden" preload="metadata"></audio>
    <audio id="userAudioHidden" preload="metadata"></audio>
  </div>

<script src="/static/script.js"></script>
</body>
</html>
