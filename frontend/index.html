<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assistant Vocal Français</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding: 10px;
    }
    
    .container {
      max-width: 950px;
      max-height: 925px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 15px 20px;
      text-align: center;
      position: relative;
    }
    
    .header h1 {
      font-size: 1.5em;
      margin-bottom: 5px;
    }
    
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      opacity: 0.9;
      gap: 20px;
    }
    
    .header-info p {
      margin: 0;
      flex: 1;
    }
    
    .theme-display {
      font-weight: bold;
      white-space: nowrap;
      min-width: fit-content;
    }
    
    /* Chat History Toggle */
    .chat-toggle {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      transition: background 0.3s ease;
    }
    
    .chat-toggle:hover {
      background: rgba(255,255,255,0.3);
    }
    
    /* Chat History Dropdown - Niedriger */
    .chat-history {
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      max-height: 0;
      overflow-y: auto;
      transition: max-height 0.3s ease;
    }
    
    .chat-history.show {
      max-height: 160px; /* Reduziert von 200px auf 160px */
      padding: 12px 20px; /* Reduziert von 15px */
    }
    
    .chat-message {
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85em;
      line-height: 1.3;
    }
    
    .chat-message.user {
      background: #e6fffa;
      border-left: 3px solid #38b2ac;
    }
    
    .chat-message.assistant {
      background: #fef5e7;
      border-left: 3px solid #ed8936;
    }
    
    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    /* Start Section */
    #startSection {
      text-align: center;
      padding: 40px 20px;
    }
    
    #startSection h3 {
      margin-bottom: 20px;
      color: #4a5568;
    }
    
    /* Conversation Section - Kompakt ohne separaten Scenario-Display */
    #conversationSection {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr auto; /* Entfernt auto für scenario-display */
      gap: 15px;
      height: 100%;
      max-height: calc(925px - 120px); /* Header height */
    }
    
    .scenario-display {
      text-align: center;
      font-weight: bold;
      color: #4a5568;
      background: #f7fafc;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 0.9em;
    }
    
    /* Compact Text Blocks */
    .text-block {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      border-left: 4px solid #667eea;
      display: flex;
      flex-direction: column;
      min-height: 0; /* Allow shrinking */
    }
    
    .text-block h3 {
      font-size: 1em;
      margin-bottom: 8px;
      color: #4a5568;
    }
    
    .text-content {
      flex: 1;
      font-size: 0.9em;
      line-height: 1.4;
      background: white;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      min-height: 80px;
      max-height: 120px; /* Reduziert von 150px auf 120px für einheitliche Höhe */
      overflow-y: auto;
    }
    
    .editable-text {
      background: #f0fff4 !important;
      border: 2px solid #38a169 !important;
      outline: none;
      cursor: text;
    }
    
    .user-input { border-left-color: #38b2ac !important; }
    .assistant-response { border-left-color: #ed8936 !important; }
    
    /* Compact Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    
    .controls-inline {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    /* Buttons - Much more compact */
    button, select {
      padding: 6px 12px;
      font-size: 0.85em;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    
    select {
      width: 100%;
      background: white;
      padding: 8px 12px;
    }
    
    /* Button Variants */
    .btn-primary {
      background: #667eea;
      color: white;
      border: none;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: #5a67d8;
    }
    
    .btn-record {
      background: #e53e3e;
      color: white;
      border: none;
    }
    
    .btn-record:hover:not(:disabled) {
      background: #c53030;
    }
    
    .btn-record.recording {
      background: #fc8181;
      animation: pulse 1.5s infinite;
    }
    
    .btn-record.paused {
      background: #f6ad55;
    }
    
    .btn-stop {
      background: #2d3748;
      color: white;
      border: none;
    }
    
    .btn-send {
      background: #38a169;
      color: white;
      border: none;
      font-weight: 600;
    }
    
    .btn-send:hover:not(:disabled) {
      background: #2f855a;
    }
    
    .btn-secondary {
      background: #718096;
      color: white;
      border: none;
    }
    
    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }
    
    /* Audio Elements - Verbesserte Darstellung */
    .audio-player {
      flex: 1;
      min-width: 200px;
      max-width: 300px;
      height: 30px;
    }
    
    /* Custom Audio Controls - Gleiche Länge für alle Elemente */
    .audio-player::-webkit-media-controls-panel {
      background-color: #f7fafc;
    }
    
    .audio-player::-webkit-media-controls-timeline {
      flex: 1;
      min-width: 120px;
    }
    
    .audio-player::-webkit-media-controls-volume-slider {
      min-width: 120px !important;
      width: 120px !important;
      flex: 0 0 120px;
    }
    
    /* Footer Controls */
    .footer-controls {
      text-align: center;
      padding: 15px 0;
      border-top: 1px solid #e2e8f0;
    }
    
    /* Status Messages */
    .status-message {
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0;
      font-size: 0.85em;
      text-align: center;
    }
    
    .status-loading { background: #bee3f8; color: #2b6cb0; }
    .status-error { background: #fed7d7; color: #c53030; }
    .status-success { background: #c6f6d5; color: #2f855a; }
    .status-warning { background: #fef5e7; color: #c05621; }
    
    /* Utilities */
    .hidden { display: none !important; }
    .placeholder { color: #a0aec0; font-style: italic; }
    
    .keyboard-hint {
      font-size: 0.75em;
      color: #718096;
      text-align: center;
      margin-top: 5px;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    /* Mobile Responsive */
    @media (max-width: 768px) {
      body { padding: 5px; }
      
      .container {
        max-height: 100vh;
        border-radius: 0;
      }
      
      .header { padding: 10px 15px; }
      .header h1 { font-size: 1.3em; }
      
      .header-info {
        flex-direction: column;
        gap: 5px;
        text-align: center;
      }
      
      .main-content { padding: 15px; }
      
      #conversationSection {
        gap: 10px;
        max-height: calc(100vh - 100px);
      }
      
      .controls, .controls-inline {
        justify-content: center;
      }
      
      .audio-player {
        min-width: 150px;
        max-width: 100%;
      }
      
      .text-content {
        max-height: 120px;
        font-size: 1em;
      }
      
      .chat-toggle {
        position: static;
        margin-top: 10px;
      }
    }
    
    @media (max-width: 480px) {
      .controls, .controls-inline {
        flex-direction: column;
        align-items: stretch;
      }
      
      .controls > *, .controls-inline > * {
        flex: 1;
        margin: 2px 0;
      }
      
      .text-content {
        max-height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img src="favicon-32x32tp.png"> <h1>Assistant Vocal Français B1/B2</h1>
      <button class="chat-toggle" id="chatToggle">📜 Historique</button>
      <div class="header-info">
        <div class="theme-display">
          <span id="currentScenarioDisplay">Thème: Non sélectionné</span>
        </div>
      </div>
    </div>

    <!-- Chat History (Collapsible) -->
    <div class="chat-history" id="chatHistory">
      <div id="chatMessages">
        <!-- Chat messages will be inserted here -->
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Start Section -->
      <div id="startSection">
        <h3>Choisissez un thème de conversation :</h3>
        <select id="scenario">
          <option value="">-- Sélectionnez un thème --</option>
          <option value="restaurant">🍽️ Restaurant - Commander un repas</option>
          <option value="loisirs">🎯 Loisirs - Parler de vos hobbies</option>
          <option value="travail">💼 Travail - Environnement professionnel</option>
          <option value="faire_les_courses">🛒 Faire les courses - Au supermarché</option>
          <option value="visite_chez_le_médecin">🏥 Visite chez le médecin</option>
          <option value="voyage">✈️ Voyage - Planifier des vacances</option>
          <option value="libre">💬 Sujet libre (conversation ouverte)</option>
        </select>
        <div style="margin-top: 20px;">
          <button id="startConversation" class="btn-primary">🚀 Démarrer la conversation</button>
        </div>
      </div>

      <!-- Conversation Section -->
      <div id="conversationSection" class="hidden">
        <!-- Assistant Response -->
        <div class="text-block assistant-response">
          <h3>👨‍🏫 Réponse de l'assistant</h3>
          <div class="text-content" id="responseText">...</div>
          
          <div class="controls-inline">
            <audio id="audioPlayback" controls class="audio-player hidden">
              Votre navigateur ne supporte pas l'élément audio.
            </audio>
            <button id="showResponseBtn" class="btn-secondary hidden">👁️ Afficher</button>
          </div>
        </div>

        <!-- User Input Section -->
        <div class="text-block user-input">
          <h3>🎙️ Votre réponse</h3>
          
          <div class="controls-inline">
            <button id="record" class="btn-record">🎙️ Enregistrer</button>
            <button id="stop" class="btn-stop hidden">🛑 Stop</button>
            <audio id="userAudio" controls class="audio-player hidden">
              Votre navigateur ne supporte pas l'élément audio.
            </audio>
            <button id="sendMessage" class="btn-send">📤 Envoyer</button>
          </div>
          
          <div class="keyboard-hint">
            Raccourcis: Espace = Pause/Reprendre | Ctrl+Entrée = Envoyer
          </div>
          
          <div id="recordingStatus" class="hidden"></div>
          
          <!-- Editable Text -->
          <div class="text-content editable-text" 
               id="userText" 
               contenteditable="true"
               data-placeholder="Tapez votre message ici ou utilisez l'enregistrement...">
            Tapez votre message ici ou utilisez l'enregistrement...
          </div>
        </div>

        <!-- Footer Controls -->
        <div class="footer-controls">
          <button id="newConversation" class="btn-secondary">🔄 Nouveau sujet</button>
        </div>
      </div>
    </div>
  </div>

<script src="/static/script.js"></script>
<script>
// Chat History Functionality
document.addEventListener('DOMContentLoaded', function() {
  const chatToggle = document.getElementById('chatToggle');
  const chatHistory = document.getElementById('chatHistory');
  const chatMessages = document.getElementById('chatMessages');
  
  // Toggle chat history
  chatToggle.addEventListener('click', () => {
    chatHistory.classList.toggle('show');
    chatToggle.textContent = chatHistory.classList.contains('show') ? '📜 Masquer' : '📜 Historique';
  });
  
  // Function to add message to chat history
  window.addToChatHistory = function(role, message) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `chat-message ${role}`;
    messageDiv.innerHTML = `<strong>${role === 'user' ? '👤 Vous' : '👨‍🏫 Assistant'}:</strong> ${message.substring(0, 100)}${message.length > 100 ? '...' : ''}`;
    chatMessages.appendChild(messageDiv);
    
    // Auto-scroll to bottom
    chatHistory.scrollTop = chatHistory.scrollHeight;
    
    // Limit to 20 messages
    while (chatMessages.children.length > 20) {
      chatMessages.removeChild(chatMessages.firstChild);
    }
  };j
  
  // Function to clear chat history
  window.clearChatHistory = function() {
    chatMessages.innerHTML = '';
  };
});
</script>
</body>
</html>
